<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代化推箱子闯关</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 白昼模式变量 */
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e9ecef;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --accent-primary: #6c5ce7;
            --accent-secondary: #a29bfe;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #ff7675;
            --border: #dee2e6;
            --shadow: rgba(99, 99, 99, 0.1);
            --shadow-light: rgba(0, 0, 0, 0.05);

            /* 游戏元素颜色 */
            --wall: #495057;
            --floor: #f8f9fa;
            --player: #6c5ce7;
            --box: #fdcb6e;
            --target: #00b894;
            --box-on-target: #00cec9;
        }

        .dark-mode {
            /* 黑夜模式变量 */
            --bg-primary: #1a1b2e;
            --bg-secondary: #25273e;
            --bg-tertiary: #2f3247;
            --text-primary: #f8f9fa;
            --text-secondary: #adb5bd;
            --accent-primary: #8a7df1;
            --accent-secondary: #6c5ce7;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #ff7675;
            --border: #404359;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-light: rgba(255, 255, 255, 0.05);

            /* 游戏元素颜色 */
            --wall: #343a40;
            --floor: #2f3247;
            --player: #8a7df1;
            --box: #fdcb6e;
            --target: #00b894;
            --box-on-target: #00cec9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .game-container {
            max-width: 1200px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 24px;
            box-shadow: 0 20px 60px var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 700px;
        }

        /* 头部区域 */
        .header {
            background: var(--bg-tertiary);
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            border-bottom: 1px solid var(--border);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--success), var(--warning));
        }

        .title-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .game-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* 主题切换按钮 */
        .theme-toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 50px;
            width: 60px;
            height: 30px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--accent-primary);
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: var(--accent-primary);
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .dark-mode .toggle-slider {
            transform: translateX(30px);
            background: var(--warning);
        }

        /* 主内容区域 */
        .main-content {
            display: flex;
            flex: 1;
            min-height: 500px;
        }

        /* 游戏区域 */
        .game-area {
            flex: 3;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--bg-secondary);
        }

        /* 游戏画布容器 */
        .game-board-container {
            position: relative;
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px var(--shadow);
            border: 1px solid var(--border);
        }

        #game-canvas {
            display: block;
            background: var(--bg-secondary);
            border-radius: 8px;
            box-shadow: inset 0 0 10px var(--shadow);
        }

        /* 控制面板 */
        .control-panel {
            flex: 1;
            padding: 30px;
            background: var(--bg-tertiary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 25px;
            min-width: 300px;
        }

        /* 游戏状态 */
        .game-stats {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--border);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-3px);
        }

        .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: var(--accent-primary);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* 关卡选择 */
        .level-selector {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--border);
        }

        .level-selector h3 {
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .level-grid::-webkit-scrollbar {
            width: 6px;
        }

        .level-grid::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        .level-grid::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }

        .level-btn {
            aspect-ratio: 1;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .level-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .level-btn.current {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .level-btn.completed {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .level-btn.locked {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .level-btn.completed::after {
            content: '✓';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 0.7rem;
        }

        /* 控制按钮 */
        .game-controls {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--border);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            border: 2px solid var(--accent-primary);
        }

        .btn-primary:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
            transform: translateY(-3px);
        }

        .btn-success {
            background: var(--success);
            color: white;
            border: 2px solid var(--success);
        }

        .btn-success:hover {
            background: #00a085;
            border-color: #00a085;
            transform: translateY(-3px);
        }

        .btn-warning {
            background: var(--warning);
            color: #333;
            border: 2px solid var(--warning);
        }

        .btn-warning:hover {
            background: #ffc049;
            border-color: #ffc049;
            transform: translateY(-3px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border: 2px solid var(--danger);
        }

        .btn-danger:hover {
            background: #ff5e5e;
            border-color: #ff5e5e;
            transform: translateY(-3px);
        }

        /* 操作提示 */
        .instructions {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--border);
        }

        .instructions h3 {
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .instruction-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .instruction-icon {
            color: var(--accent-primary);
            font-size: 1rem;
            min-width: 20px;
        }

        /* 游戏元素说明 */
        .legend {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 15px var(--shadow);
            border: 1px solid var(--border);
        }

        .legend h3 {
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .legend-icon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .wall-icon {
            background: var(--wall);
            color: white;
        }

        .player-icon {
            background: var(--player);
            color: white;
        }

        .box-icon {
            background: var(--box);
            color: #333;
        }

        .target-icon {
            background: var(--target);
            color: white;
        }

        .box-on-target-icon {
            background: var(--box-on-target);
            color: white;
        }

        /* 状态栏 */
        .status-bar {
            background: var(--bg-tertiary);
            padding: 20px 30px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            border-top: 1px solid var(--border);
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .status-bar.success {
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
            border-color: rgba(0, 184, 148, 0.2);
        }

        /* 动画类 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes celebrate {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.2) rotate(10deg); }
            50% { transform: scale(1.1) rotate(-10deg); }
            75% { transform: scale(1.15) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes moveAnimation {
            from { transform: translate(var(--from-x), var(--from-y)); }
            to { transform: translate(0, 0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease;
        }

        .celebrate {
            animation: celebrate 0.8s ease;
        }

        .pulse {
            animation: pulse 0.5s ease infinite;
        }

        /* 移动动画 */
        .moving {
            animation: moveAnimation 0.2s ease;
        }

        /* 胜利动画 */
        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: confetti-fall 3s linear forwards;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
            }

            .control-panel {
                border-left: none;
                border-top: 1px solid var(--border);
                flex-direction: row;
                flex-wrap: wrap;
                gap: 20px;
            }

            .game-stats,
            .level-selector,
            .game-controls,
            .instructions,
            .legend {
                flex: 1;
                min-width: 200px;
            }
        }

        @media (max-width: 768px) {
            .game-container {
                border-radius: 20px;
            }

            .header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .game-area {
                padding: 20px;
            }

            .control-panel {
                padding: 20px;
            }

            .level-grid {
                grid-template-columns: repeat(6, 1fr);
            }

            .controls-grid {
                grid-template-columns: 1fr;
            }

            .legend-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .level-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .game-stats,
            .level-selector,
            .game-controls,
            .instructions,
            .legend {
                min-width: 100%;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) {
            .stat-item:hover,
            .level-btn:hover,
            .btn:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- 头部 -->
        <div class="header">
            <div class="title-container">
                <div class="game-icon">
                    <i class="fas fa-boxes"></i>
                </div>
                <div>
                    <h1 class="game-title">现代化推箱子</h1>
                    <p class="game-subtitle">经典益智游戏，自动保存进度</p>
                </div>
            </div>

            <!-- 主题切换 -->
            <div class="theme-toggle-container">
                <div class="theme-toggle" id="theme-toggle">
                    <div class="toggle-slider">
                        <i class="fas fa-sun"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 游戏区域 -->
            <div class="game-area">
                <div class="game-board-container">
                    <canvas id="game-canvas" width="600" height="600"></canvas>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="control-panel">
                <!-- 游戏状态 -->
                <div class="game-stats">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-icon">📦</div>
                            <div class="stat-value" id="moves-count">0</div>
                            <div class="stat-label">移动步数</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon">🎯</div>
                            <div class="stat-value" id="boxes-left">0</div>
                            <div class="stat-label">剩余箱子</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon">🏆</div>
                            <div class="stat-value" id="level-completed">0</div>
                            <div class="stat-label">完成关卡</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon">⏱️</div>
                            <div class="stat-value" id="time-elapsed">0s</div>
                            <div class="stat-label">用时</div>
                        </div>
                    </div>
                </div>

                <!-- 关卡选择 -->
                <div class="level-selector">
                    <h3>选择关卡</h3>
                    <div class="level-grid" id="level-grid"></div>
                </div>

                <!-- 游戏控制 -->
                <div class="game-controls">
                    <div class="controls-grid">
                        <button class="btn btn-primary" id="restart-level-btn">
                            <i class="fas fa-redo"></i> 重玩关卡
                        </button>
                        <button class="btn btn-success" id="prev-level-btn">
                            <i class="fas fa-arrow-left"></i> 上一关
                        </button>
                        <button class="btn btn-warning" id="undo-btn">
                            <i class="fas fa-undo"></i> 撤销
                        </button>
                        <button class="btn btn-danger" id="next-level-btn">
                            <i class="fas fa-arrow-right"></i> 下一关
                        </button>
                    </div>
                </div>

                <!-- 操作提示 -->
                <div class="instructions">
                    <h3>操作说明</h3>
                    <div class="instruction-item">
                        <i class="fas fa-arrow-up instruction-icon"></i>
                        <span>方向键/WASD：移动角色</span>
                    </div>
                    <div class="instruction-item">
                        <i class="fas fa-redo instruction-icon"></i>
                        <span>R键：重玩当前关卡</span>
                    </div>
                    <div class="instruction-item">
                        <i class="fas fa-undo instruction-icon"></i>
                        <span>Z键/U键：撤销操作</span>
                    </div>
                    <div class="instruction-item">
                        <i class="fas fa-save instruction-icon"></i>
                        <span>自动保存：关闭页面不会丢失进度</span>
                    </div>
                </div>

                <!-- 游戏元素说明 -->
                <div class="legend">
                    <h3>游戏元素</h3>
                    <div class="legend-grid">
                        <div class="legend-item">
                            <div class="legend-icon wall-icon">#</div>
                            <span>墙壁</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon player-icon">P</div>
                            <span>玩家</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon box-icon">$</div>
                            <span>箱子</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon target-icon">.</div>
                            <span>目标点</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon box-on-target-icon">*</div>
                            <span>箱子在目标上</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar" id="status-bar">
            游戏已就绪！使用方向键移动角色
        </div>
    </div>

    <script>
        class SokobanGame {
            constructor() {
                // 游戏配置
                this.tileSize = 60;
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.currentLevel = 0;
                this.moves = 0;
                this.boxesLeft = 0;
                this.levelCompletedCount = 0;
                this.startTime = null;
                this.timerInterval = null;
                this.elapsedTime = 0;
                this.gameState = null;
                this.history = [];
                this.maxUndoSteps = 50;

                // 关卡数据
                this.levels = this.createLevels();

                // 获取DOM元素
                this.elements = {
                    movesCount: document.getElementById('moves-count'),
                    boxesLeft: document.getElementById('boxes-left'),
                    levelCompleted: document.getElementById('level-completed'),
                    timeElapsed: document.getElementById('time-elapsed'),
                    levelGrid: document.getElementById('level-grid'),
                    statusBar: document.getElementById('status-bar'),
                    themeToggle: document.getElementById('theme-toggle'),

                    // 按钮
                    restartLevelBtn: document.getElementById('restart-level-btn'),
                    prevLevelBtn: document.getElementById('prev-level-btn'),
                    undoBtn: document.getElementById('undo-btn'),
                    nextLevelBtn: document.getElementById('next-level-btn')
                };

                // 初始化游戏
                this.init();
            }

            init() {
                // 设置事件监听器
                this.setupEventListeners();

                // 检查主题设置
                this.checkTheme();

                // 加载保存的进度
                this.loadProgress();

                // 初始化关卡选择器
                this.initLevelSelector();

                // 开始游戏

            setupEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));

                // 主题切换
                this.elements.themeToggle.addEventListener('click', () => this.toggleTheme());

                // 控制按钮
                this.elements.restartLevelBtn.addEventListener('click', () => this.restartLevel());
                this.elements.prevLevelBtn.addEventListener('click', () => this.prevLevel());
                this.elements.undoBtn.addEventListener('click', () => this.undo());
                this.elements.nextLevelBtn.addEventListener('click', () => this.nextLevel());

                // 窗口大小变化时调整画布
                window.addEventListener('resize', () => this.adjustCanvasSize());
            }

            handleKeyPress(e) {
                if (this.gameState?.completed) return;

                let dx = 0, dy = 0;
                let moved = false;

                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        dy = -1;
                        moved = this.movePlayer(0, -1);
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        dy = 1;
                        moved = this.movePlayer(0, 1);
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        dx = -1;
                        moved = this.movePlayer(-1, 0);
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        dx = 1;
                        moved = this.movePlayer(1, 0);
                        break;
                    case 'r':
                    case 'R':
                        e.preventDefault();
                        this.restartLevel();
                        return;
                    case 'z':
                    case 'Z':
                    case 'u':
                    case 'U':
                        e.preventDefault();
                        this.undo();
                        return;
                }

                if (moved) {
                    // 保存状态到历史记录
                    this.saveToHistory();

                    // 更新移动计数
                    this.moves++;
                    this.elements.movesCount.textContent = this.moves;

                    // 检查是否完成关卡
                    this.checkLevelCompletion();

                    // 保存进度
                    this.saveProgress();
                }
            }

            startLevel(levelIndex) {
                // 停止当前计时器
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                }

                // 重置游戏状态
                this.currentLevel = levelIndex;
                this.moves = 0;
                this.startTime = Date.now();
                this.elapsedTime = 0;
                this.history = [];

                // 获取关卡数据
                const level = this.levels[levelIndex];
                if (!level) return;

                // 初始化游戏状态
                this.gameState = {
                    width: level.width,
                    height: level.height,
                    map: [],
                    player: { x: 0, y: 0 },
                    boxes: [],
                    targets: [],
                    completed: false
                };

                // 解析地图
                this.parseLevelMap(level.map);

                // 更新UI
                this.elements.movesCount.textContent = this.moves;
                this.updateBoxesLeft();
                this.updateLevelSelector();

                // 调整画布大小
                this.adjustCanvasSize();

                // 绘制游戏
                this.drawGame();

                // 更新状态栏
                this.elements.statusBar.textContent = `关卡 ${levelIndex + 1}: ${level.name} - 使用方向键移动角色`;
                this.elements.statusBar.className = 'status-bar fade-in';

                // 启动计时器
                this.startTimer();

                // 保存进度
                this.saveProgress();
            }

            parseLevelMap(map) {
                this.gameState.boxes = [];
                this.gameState.targets = [];

                for (let y = 0; y < this.gameState.height; y++) {
                    const row = map[y];
                    this.gameState.map[y] = [];

                    for (let x = 0; x < this.gameState.width; x++) {
                        const char = row?.[x] || ' ';

                        switch (char) {
                            case '#':
                                this.gameState.map[y][x] = 'wall';
                                break;
                            case '$':
                                this.gameState.map[y][x] = 'floor';
                                this.gameState.boxes.push({ x, y });
                                break;
                            case '.':
                                this.gameState.map[y][x] = 'floor';
                                this.gameState.targets.push({ x, y });
                                break;
                            case '*':
                                this.gameState.map[y][x] = 'floor';
                                this.gameState.boxes.push({ x, y });
                                this.gameState.targets.push({ x, y });
                                break;
                            case '@':
                            case 'P':
                                this.gameState.map[y][x] = 'floor';
                                this.gameState.player = { x, y };
                                break;
                            case '+':
                                this.gameState.map[y][x] = 'floor';
                                this.gameState.player = { x, y };
                                this.gameState.targets.push({ x, y });
                                break;
                            default:
                                this.gameState.map[y][x] = 'floor';
                        }
                    }
                }
            }

            movePlayer(dx, dy) {
                if (this.gameState.completed) return false;

                const { player, boxes } = this.gameState;
                const newX = player.x + dx;
                const newY = player.y + dy;

                // 检查是否撞墙
                if (this.isWall(newX, newY)) {
                    return false;
                }

                // 检查是否碰到箱子
                const boxIndex = this.getBoxAt(newX, newY);
                if (boxIndex !== -1) {
                    const boxNewX = newX + dx;
                    const boxNewY = newY + dy;

                    // 检查箱子是否可以推动
                    if (this.isWall(boxNewX, boxNewY) || this.getBoxAt(boxNewX, boxNewY) !== -1) {
                        return false;
                    }

                    // 移动箱子
                    boxes[boxIndex].x = boxNewX;
                    boxes[boxIndex].y = boxNewY;
                }

                // 移动玩家
                player.x = newX;
                player.y = newY;

                // 绘制游戏
                this.drawGame();

                return true;
            }

            isWall(x, y) {
                if (x < 0 || x >= this.gameState.width || y < 0 || y >= this.gameState.height) {
                    return true;
                }
                return this.gameState.map[y][x] === 'wall';
            }

            getBoxAt(x, y) {
                return this.gameState.boxes.findIndex(box => box.x === x && box.y === y);
            }

            isTarget(x, y) {
                return this.gameState.targets.some(target => target.x === x && target.y === y);
            }

            checkLevelCompletion() {
                let completed = true;
                for (const target of this.gameState.targets) {
                    const boxIndex = this.getBoxAt(target.x, target.y);
                    if (boxIndex === -1) {
                        completed = false;
                        break;
                    }
                }

                if (completed && !this.gameState.completed) {
                    this.gameState.completed = true;
                    this.onLevelComplete();
                }

                this.updateBoxesLeft();

                return completed;
            }

            updateBoxesLeft() {
                let boxesOnTarget = 0;
                for (const target of this.gameState.targets) {
                    if (this.getBoxAt(target.x, target.y) !== -1) {
                        boxesOnTarget++;
                    }
                }

                this.boxesLeft = this.gameState.targets.length - boxesOnTarget;
                this.elements.boxesLeft.textContent = this.boxesLeft;
            }

            onLevelComplete() {
                // 停止计时器
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                }

                // 更新完成关卡数
                this.levelCompletedCount = Math.max(this.levelCompletedCount, this.currentLevel + 1);
                this.elements.levelCompleted.textContent = this.levelCompletedCount;

                // 显示成功消息
                this.elements.statusBar.textContent = `🎉 恭喜！完成关卡 ${this.currentLevel + 1}！步数: ${this.moves}，用时: ${this.formatTime(this.elapsedTime)}`;
                this.elements.statusBar.className = 'status-bar success fade-in';

                // 更新关卡选择器
                this.updateLevelSelector();

                // 保存进度
                this.saveProgress();

                // 播放庆祝动画
                this.createConfetti();

                // 3秒后自动进入下一关
                setTimeout(() => {
                    if (this.currentLevel < this.levels.length - 1) {
                        this.nextLevel();
                    }
                }, 3000);
            }

            restartLevel() {
                this.startLevel(this.currentLevel);
                this.elements.statusBar.textContent = `重新开始关卡 ${this.currentLevel + 1}`;
                this.elements.statusBar.className = 'status-bar fade-in';
            }

            prevLevel() {
                if (this.currentLevel > 0) {
                    this.startLevel(this.currentLevel - 1);
                }
            }

            nextLevel() {
                if (this.currentLevel < this.levels.length - 1) {
                    this.startLevel(this.currentLevel + 1);
                } else {
                    this.elements.statusBar.textContent = '🎊 恭喜你完成了所有关卡！';
                    this.elements.statusBar.className = 'status-bar success fade-in';
                }
            }

            undo() {
                if (this.history.length > 0) {
                    const previousState = this.history.pop();
                    this.gameState = previousState;
                    this.moves--;
                    this.elements.movesCount.textContent = this.moves;
                    this.updateBoxesLeft();
                    this.drawGame();

                    this.elements.statusBar.textContent = '撤销了上一步操作';
                    this.elements.statusBar.className = 'status-bar fade-in';
                } else {
                    this.elements.statusBar.textContent = '没有可撤销的操作';
                    this.elements.statusBar.className = 'status-bar fade-in';
                }
            }

            saveToHistory() {
                // 限制历史记录长度
                if (this.history.length >= this.maxUndoSteps) {
                    this.history.shift();
                }

                // 深拷贝当前状态
                const stateCopy = {
                    width: this.gameState.width,
                    height: this.gameState.height,
                    map: JSON.parse(JSON.stringify(this.gameState.map)),
                    player: { ...this.gameState.player },
                    boxes: JSON.parse(JSON.stringify(this.gameState.boxes)),
                    targets: JSON.parse(JSON.stringify(this.gameState.targets)),
                    completed: this.gameState.completed
                };

                this.history.push(stateCopy);
            }

            startTimer() {
                this.startTime = Date.now();

                this.timerInterval = setInterval(() => {
                    this.elapsedTime = Math.floor((Date.now() - this.startTime) / 1000);
                    this.elements.timeElapsed.textContent = `${this.elapsedTime}s`;
                }, 1000);
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
            }

            adjustCanvasSize() {
                if (!this.gameState) return;

                const container = this.canvas.parentElement;
                const containerWidth = container.clientWidth - 40; // 减去padding
                const containerHeight = container.clientHeight - 40;

                // 计算合适的tileSize
                const maxWidth = containerWidth / this.gameState.width;
                const maxHeight = containerHeight / this.gameState.height;
                this.tileSize = Math.min(maxWidth, maxHeight, 60);

                // 更新画布尺寸
                this.canvas.width = this.gameState.width * this.tileSize;
                this.canvas.height = this.gameState.height * this.tileSize;

                // 重新绘制
                this.drawGame();
            }

            drawGame() {
                if (!this.gameState || !this.ctx) return;

                const { ctx, tileSize } = this;
                const { map, player, boxes, targets } = this.gameState;

                // 清除画布
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制地板和墙壁
                for (let y = 0; y < this.gameState.height; y++) {
                    for (let x = 0; x < this.gameState.width; x++) {
                        const tileX = x * tileSize;
                        const tileY = y * tileSize;

                        // 绘制地板
                        ctx.fillStyle = getComputedStyle(document.documentElement)
                            .getPropertyValue('--floor').trim();
                        ctx.fillRect(tileX, tileY, tileSize, tileSize);

                        // 绘制墙壁
                        if (map[y][x] === 'wall') {
                            ctx.fillStyle = getComputedStyle(document.documentElement)
                                .getPropertyValue('--wall').trim();
                            ctx.fillRect(tileX, tileY, tileSize, tileSize);

                            // 墙壁纹理
                            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                            ctx.fillRect(tileX + 2, tileY + 2, tileSize - 4, tileSize - 4);
                        }
                    }
                }

                // 绘制目标点
                for (const target of targets) {
                    const tileX = target.x * tileSize;
                    const tileY = target.y * tileSize;

                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue('--target').trim();
                    ctx.beginPath();
                    ctx.arc(
                        tileX + tileSize / 2,
                        tileY + tileSize / 2,
                        tileSize / 4,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();

                    // 目标点边框
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // 绘制箱子
                for (const box of boxes) {
                    const tileX = box.x * tileSize;
                    const tileY = box.y * tileSize;
                    const isOnTarget = this.isTarget(box.x, box.y);

                    // 箱子颜色
                    ctx.fillStyle = getComputedStyle(document.documentElement)
                        .getPropertyValue(isOnTarget ? '--box-on-target' : '--box').trim();

                    // 绘制箱子（圆角矩形）
                    const borderRadius = tileSize / 6;
                    ctx.beginPath();
                    ctx.roundRect(
                        tileX + 4,
                        tileY + 4,
                        tileSize - 8,
                        tileSize - 8,
                        borderRadius
                    );
                    ctx.fill();

                    // 箱子阴影和边框
                    ctx.strokeStyle = isOnTarget ? 'rgba(255, 255, 255, 0.8)' : 'rgba(0, 0, 0, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 箱子高光
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.beginPath();
                    ctx.roundRect(
                        tileX + 6,
                        tileY + 6,
                        tileSize - 16,
                        tileSize / 4,
                        borderRadius / 2
                    );
                    ctx.fill();
                }

                // 绘制玩家
                const playerX = player.x * tileSize;
                const playerY = player.y * tileSize;

                // 玩家身体
                ctx.fillStyle = getComputedStyle(document.documentElement)
                    .getPropertyValue('--player').trim();
                ctx.beginPath();
                ctx.arc(
                    playerX + tileSize / 2,
                    playerY + tileSize / 2,
                    tileSize / 3,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // 玩家眼睛
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(
                    playerX + tileSize / 2 - tileSize / 8,
                    playerY + tileSize / 2 - tileSize / 8,
                    tileSize / 10,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                ctx.beginPath();
                ctx.arc(
                    playerX + tileSize / 2 + tileSize / 8,
                    playerY + tileSize / 2 - tileSize / 8,
                    tileSize / 10,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // 玩家瞳孔
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(
                    playerX + tileSize / 2 - tileSize / 8,
                    playerY + tileSize / 2 - tileSize / 8,
                    tileSize / 20,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                ctx.beginPath();
                ctx.arc(
                    playerX + tileSize / 2 + tileSize / 8,
                    playerY + tileSize / 2 - tileSize / 8,
                    tileSize / 20,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // 玩家嘴巴
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(
                    playerX + tileSize / 2,
                    playerY + tileSize / 2 + tileSize / 8,
                    tileSize / 8,
                    0,
                    Math.PI
                );
                ctx.stroke();
            }

            initLevelSelector() {
                const grid = this.elements.levelGrid;
                grid.innerHTML = '';

                for (let i = 0; i < this.levels.length; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'level-btn';
                    btn.textContent = i + 1;
                    btn.dataset.level = i;

                    if (i === this.currentLevel) {
                        btn.classList.add('current');
                    } else if (i < this.levelCompletedCount) {
                        btn.classList.add('completed');
                    } else if (i > this.levelCompletedCount) {
                        btn.classList.add('locked');
                    }

                    btn.addEventListener('click', () => {
                        if (i <= this.levelCompletedCount) {
                            this.startLevel(i);
                        }
                    });

                    grid.appendChild(btn);
                }
            }

            updateLevelSelector() {
                const buttons = this.elements.levelGrid.children;

                for (let i = 0; i < buttons.length; i++) {
                    const btn = buttons[i];
                    btn.classList.remove('current', 'completed', 'locked');

                    if (i === this.currentLevel) {
                        btn.classList.add('current');
                    } else if (i < this.levelCompletedCount) {
                        btn.classList.add('completed');
                    } else if (i > this.levelCompletedCount) {
                        btn.classList.add('locked');
                    }
                }
            }

            saveProgress() {
                const progress = {
                    currentLevel: this.currentLevel,
                    levelCompletedCount: this.levelCompletedCount,
                    moves: this.moves,
                    elapsedTime: this.elapsedTime
                };

                localStorage.setItem('sokoban-progress', JSON.stringify(progress));
            }

            loadProgress() {
                const saved = localStorage.getItem('sokoban-progress');
                if (saved) {
                    try {
                        const progress = JSON.parse(saved);
                        this.currentLevel = progress.currentLevel || 0;
                        this.levelCompletedCount = progress.levelCompletedCount || 0;
                        this.moves = progress.moves || 0;
                        this.elapsedTime = progress.elapsedTime || 0;

                        this.elements.levelCompleted.textContent = this.levelCompletedCount;
                    } catch (e) {
                        console.log('无法加载进度，开始新游戏');
                    }
                }
            }

            toggleTheme() {
                document.body.classList.toggle('dark-mode');

                // 更新按钮图标
                const icon = this.elements.themeToggle.querySelector('i');
                if (document.body.classList.contains('dark-mode')) {
                    icon.className = 'fas fa-moon';
                    localStorage.setItem('sokoban-theme', 'dark');
                } else {
                    icon.className = 'fas fa-sun';
                    localStorage.setItem('sokoban-theme', 'light');
                }

                // 重新绘制游戏以适应新主题
                this.drawGame();
            }

            checkTheme() {
                const savedTheme = localStorage.getItem('sokoban-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.body.classList.add('dark-mode');
                    const icon = this.elements.themeToggle.querySelector('i');
                    icon.className = 'fas fa-moon';
                }
            }

            createConfetti() {
                const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#ff7675', '#a29bfe'];

                for (let i = 0; i < 100; i++) {
                    setTimeout(() => {
                        const confetti = document.createElement('div');
                        confetti.className = 'confetti';

                        // 随机属性
                        const size = Math.random() * 15 + 5;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        const left = Math.random() * 100;
                        const duration = Math.random() * 3 + 2;

                        confetti.style.width = `${size}px`;
                        confetti.style.height = `${size}px`;
                        confetti.style.backgroundColor = color;
                        confetti.style.left = `${left}%`;
                        confetti.style.animationDuration = `${duration}s`;

                        // 添加到页面
                        document.body.appendChild(confetti);

                        // 动画结束后移除
                        setTimeout(() => {
                            confetti.remove();
                        }, duration * 1000);
                    }, i * 20);
                }
            }
        }
