<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>现代化扫雷游戏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* 白昼模式变量 */
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f2f5;
            --primary: #6c5ce7;
            --primary-light: #8a7df1;
            --success: #00b894;
            --danger: #ff7675;
            --warning: #fdcb6e;
            --text: #2d3436;
            --text-secondary: #636e72;
            --cell-normal: #e3e6eb;
            --cell-revealed: #f8f9fa;
            --cell-hover: #d8dbe0;
            --shadow: rgba(99, 99, 99, 0.1);
            --shadow-light: rgba(0, 0, 0, 0.05);
            --border: #e0e0e0;
        }

        .dark-mode {
            /* 黑夜模式变量 */
            --bg-primary: #1a1b2e;
            --bg-secondary: #25273e;
            --bg-tertiary: #2f3247;
            --primary: #6c5ce7;
            --primary-light: #8a7df1;
            --success: #00b894;
            --danger: #ff7675;
            --warning: #fdcb6e;
            --text: #dfe6e9;
            --text-secondary: #b2bec3;
            --cell-normal: #404359;
            --cell-revealed: #2f3247;
            --cell-hover: #4a4d6e;
            --shadow: rgba(0, 0, 0, 0.3);
            --shadow-light: rgba(255, 255, 255, 0.05);
            --border: #404359;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: 0 20px 40px var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* 头部区域 */
        .header {
            background: var(--bg-tertiary);
            padding: 25px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--success), var(--warning));
        }

        .title-container {
            text-align: left;
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--warning));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .game-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* 主题切换按钮 */
        .theme-toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 50px;
            width: 60px;
            height: 30px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .dark-mode .toggle-slider {
            transform: translateX(30px);
            background: var(--warning);
        }

        .theme-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 控制面板 */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .stats {
            display: flex;
            gap: 25px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-tertiary);
            padding: 12px 20px;
            border-radius: 12px;
            min-width: 100px;
            box-shadow: 0 5px 15px var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--border);
        }

        .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .stat-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* 按钮样式 */
        .buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px var(--shadow);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: 2px solid var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-light);
            border-color: var(--primary-light);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.3);
        }

        .btn-warning {
            background: var(--warning);
            color: #333;
            border: 2px solid var(--warning);
        }

        .btn-warning:hover {
            background: #ffd166;
            border-color: #ffd166;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(253, 203, 110, 0.3);
        }

        /* 难度选择 */
        .difficulty {
            padding: 20px 30px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .difficulty h3 {
            margin-bottom: 15px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .diff-btn {
            flex: 1;
            padding: 15px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .diff-btn:hover {
            background: var(--cell-hover);
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .diff-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.4);
        }

        /* 游戏网格 */
        .game-area {
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-secondary);
            min-height: 400px;
        }

        .mine-grid {
            display: grid;
            gap: 3px;
            background: var(--bg-tertiary);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px var(--shadow);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .mine-grid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, var(--shadow-light) 50%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .cell {
            width: 35px;
            height: 35px;
            background: var(--cell-normal);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .cell:hover {
            background: var(--cell-hover);
            transform: scale(1.05);
        }

        .cell.revealed {
            background: var(--cell-revealed);
            transform: scale(1);
            cursor: default;
            border-color: var(--border);
        }

        .cell.mine.revealed {
            background: var(--danger);
            animation: pulse 0.5s ease;
        }

        .cell.flagged {
            color: var(--warning);
        }

        .cell.mine.flagged {
            color: var(--success);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 数字颜色 */
        .cell.num-1 { color: #4a9eff; }
        .cell.num-2 { color: #5cd85c; }
        .cell.num-3 { color: #ff6b6b; }
        .cell.num-4 { color: #9b59b6; }
        .cell.num-5 { color: #ffa726; }
        .cell.num-6 { color: #26c6da; }
        .cell.num-7 { color: #7f8c8d; }
        .cell.num-8 { color: #34495e; }

        /* 状态信息 */
        .status {
            padding: 20px 30px;
            background: var(--bg-tertiary);
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            min-height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            border-top: 1px solid var(--border);
        }

        .status.win {
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
            border-color: rgba(0, 184, 148, 0.2);
        }

        .status.lose {
            background: rgba(255, 118, 117, 0.1);
            color: var(--danger);
            border-color: rgba(255, 118, 117, 0.2);
        }

        /* 动画类 */
        .reveal-animation {
            animation: reveal 0.3s ease;
        }

        @keyframes reveal {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .flag-animation {
            animation: flag 0.3s ease;
        }

        @keyframes flag {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .explosion {
            animation: explode 0.6s ease;
        }

        @keyframes explode {
            0% { transform: scale(1); }
            30% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-container {
                border-radius: 15px;
            }

            .header {
                padding: 20px;
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .title-container {
                text-align: center;
            }

            .game-title {
                font-size: 2rem;
            }

            .control-panel {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }

            .stats {
                width: 100%;
                justify-content: space-around;
            }

            .stat-box {
                min-width: 80px;
                padding: 10px 15px;
            }

            .buttons {
                width: 100%;
                justify-content: center;
            }

            .btn {
                padding: 10px 20px;
            }

            .difficulty {
                padding: 15px 20px;
            }

            .diff-btn {
                padding: 12px;
                font-size: 0.9rem;
            }

            .game-area {
                padding: 20px;
            }

            .cell {
                width: 28px;
                height: 28px;
                font-size: 0.9rem;
            }

            .status {
                padding: 15px 20px;
                font-size: 1.1rem;
            }

            .theme-toggle-container {
                position: absolute;
                top: 20px;
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            .cell {
                width: 24px;
                height: 24px;
                font-size: 0.8rem;
            }

            .stat-box {
                min-width: 70px;
                padding: 8px 12px;
            }

            .stat-icon {
                font-size: 1.5rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .difficulty-buttons {
                flex-direction: column;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) {
            .cell:hover {
                transform: none;
                background: var(--cell-normal);
            }

            .btn:hover, .diff-btn:hover {
                transform: none;
            }

            .stat-box:hover {
                transform: none;
            }
        }

        /* 胜利/失败效果 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            animation: confetti-fall 3s linear forwards;
            z-index: 1000;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 主题切换过渡 */
        .theme-transition * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="theme-transition">
    <div class="game-container">
        <div class="header">
            <div class="title-container">
                <h1 class="game-title">现代化扫雷</h1>
                <p class="game-subtitle">点击翻开格子，长按或右键标记地雷</p>
            </div>

            <!-- 主题切换 -->
            <div class="theme-toggle-container">
                <span class="theme-label">主题</span>
                <div class="theme-toggle" id="theme-toggle">
                    <div class="toggle-slider">
                        <i class="fas fa-sun"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="control-panel">
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-icon">💣</div>
                    <div class="stat-value" id="mine-count">10</div>
                    <div class="stat-label">地雷</div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-value" id="timer">0</div>
                    <div class="stat-label">时间</div>
                </div>
                <div class="stat-box">
                    <div class="stat-icon">🚩</div>
                    <div class="stat-value" id="flag-count">0</div>
                    <div class="stat-label">旗帜</div>
                </div>
            </div>

            <div class="buttons">
                <button class="btn btn-primary" id="restart-btn">
                    <i class="fas fa-redo"></i> 重新开始
                </button>
                <button class="btn btn-warning" id="hint-btn">
                    <i class="fas fa-lightbulb"></i> 提示
                </button>
            </div>
        </div>

        <div class="difficulty">
            <h3>选择难度</h3>
            <div class="difficulty-buttons">
                <button class="diff-btn active" data-difficulty="easy">简单 (9×9, 10雷)</button>
                <button class="diff-btn" data-difficulty="medium">中等 (16×16, 40雷)</button>
                <button class="diff-btn" data-difficulty="hard">困难 (16×30, 99雷)</button>
            </div>
        </div>

        <div class="game-area">
            <div class="mine-grid" id="mine-grid"></div>
        </div>

        <div class="status" id="status">游戏开始！点击任意格子开始</div>
    </div>

    <script>
        class Minesweeper {
            constructor() {
                // 难度设置
                this.difficulties = {
                    easy: { rows: 9, cols: 9, mines: 10 },
                    medium: { rows: 16, cols: 16, mines: 40 },
                    hard: { rows: 16, cols: 30, mines: 99 }
                };

                // 当前游戏状态
                this.currentDifficulty = 'easy';
                this.rows = 9;
                this.cols = 9;
                this.mines = 10;
                this.board = [];
                this.gameOver = false;
                this.gameWon = false;
                this.firstClick = true;
                this.flags = 0;
                this.time = 0;
                this.timer = null;

                // 获取DOM元素
                this.elements = {
                    mineGrid: document.getElementById('mine-grid'),
                    mineCount: document.getElementById('mine-count'),
                    flagCount: document.getElementById('flag-count'),
                    timer: document.getElementById('timer'),
                    status: document.getElementById('status'),
                    restartBtn: document.getElementById('restart-btn'),
                    hintBtn: document.getElementById('hint-btn'),
                    diffBtns: document.querySelectorAll('.diff-btn'),
                    themeToggle: document.getElementById('theme-toggle')
                };

                // 初始化游戏
                this.init();
            }

            init() {
                // 设置事件监听器
                this.elements.restartBtn.addEventListener('click', () => this.restartGame());
                this.elements.hintBtn.addEventListener('click', () => this.showHint());

                // 难度按钮事件
                this.elements.diffBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const difficulty = e.target.dataset.difficulty;
                        this.setDifficulty(difficulty);
                    });
                });

                // 主题切换事件
                this.elements.themeToggle.addEventListener('click', () => this.toggleTheme());

                // 检查保存的主题设置
                this.checkSavedTheme();

                // 初始化游戏
                this.createBoard();
                this.updateDisplay();

                // 添加触摸/右键事件支持
                this.setupInputEvents();
            }

            setDifficulty(difficulty) {
                // 更新活动按钮
                this.elements.diffBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.difficulty === difficulty);
                });

                // 更新游戏设置
                this.currentDifficulty = difficulty;
                const settings = this.difficulties[difficulty];
                this.rows = settings.rows;
                this.cols = settings.cols;
                this.mines = settings.mines;

                // 重新开始游戏
                this.restartGame();
            }

            createBoard() {
                // 清空网格
                this.elements.mineGrid.innerHTML = '';

                // 设置网格样式
                this.elements.mineGrid.style.gridTemplateColumns = `repeat(${this.cols}, 1fr)`;
                this.elements.mineGrid.style.gridTemplateRows = `repeat(${this.rows}, 1fr)`;

                // 创建单元格
                this.board = [];
                for (let row = 0; row < this.rows; row++) {
                    this.board[row] = [];
                    for (let col = 0; col < this.cols; col++) {
                        const cell = {
                            row,
                            col,
                            isMine: false,
                            isRevealed: false,
                            isFlagged: false,
                            adjacentMines: 0,
                            element: this.createCellElement(row, col)
                        };

                        this.board[row][col] = cell;
                        this.elements.mineGrid.appendChild(cell.element);
                    }
                }
            }

            createCellElement(row, col) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = row;
                cell.dataset.col = col;

                // 添加触摸/点击事件
                let touchTimer = null;

                cell.addEventListener('click', (e) => this.handleCellClick(row, col, e));
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this.toggleFlag(row, col);
                });

                // 移动端长按支持
                cell.addEventListener('touchstart', (e) => {
                    touchTimer = setTimeout(() => {
                        this.toggleFlag(row, col);
                        touchTimer = null;
                    }, 500);
                });

                cell.addEventListener('touchend', () => {
                    if (touchTimer) {
                        clearTimeout(touchTimer);
                    }
                });

                cell.addEventListener('touchmove', () => {
                    if (touchTimer) {
                        clearTimeout(touchTimer);
                        touchTimer = null;
                    }
                });

                return cell;
            }

            placeMines(firstRow, firstCol) {
                let minesPlaced = 0;

                while (minesPlaced < this.mines) {
                    const row = Math.floor(Math.random() * this.rows);
                    const col = Math.floor(Math.random() * this.cols);

                    // 确保第一个点击的格子不是地雷，且周围也不是地雷
                    if (Math.abs(row - firstRow) <= 1 && Math.abs(col - firstCol) <= 1) {
                        continue;
                    }

                    if (!this.board[row][col].isMine) {
                        this.board[row][col].isMine = true;
                        minesPlaced++;
                    }
                }

                // 计算每个格子的周围地雷数
                this.calculateAdjacentMines();
            }

            calculateAdjacentMines() {
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        if (this.board[row][col].isMine) continue;

                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;

                                const newRow = row + dr;
                                const newCol = col + dc;

                                if (
                                    newRow >= 0 && newRow < this.rows &&
                                    newCol >= 0 && newCol < this.cols &&
                                    this.board[newRow][newCol].isMine
                                ) {
                                    count++;
                                }
                            }
                        }

                        this.board[row][col].adjacentMines = count;
                    }
                }
            }

            handleCellClick(row, col, event) {
                // 防止在游戏结束时点击
                if (this.gameOver || this.gameWon) return;

                const cell = this.board[row][col];

                // 如果已经翻开或标记，则忽略
                if (cell.isRevealed || cell.isFlagged) return;

                // 第一次点击时放置地雷
                if (this.firstClick) {
                    this.firstClick = false;
                    this.placeMines(row, col);
                    this.startTimer();
                }

                // 翻开格子
                this.revealCell(row, col);

                // 检查游戏状态
                this.checkGameStatus();
            }

            revealCell(row, col) {
                const cell = this.board[row][col];

                if (cell.isRevealed || cell.isFlagged) return;

                cell.isRevealed = true;
                cell.element.classList.add('revealed', 'reveal-animation');

                // 如果是地雷，游戏结束
                if (cell.isMine) {
                    cell.element.classList.add('mine', 'explosion');
                    cell.element.innerHTML = '💣';
                    this.gameOver = true;
                    this.stopTimer();
                    this.revealAllMines();
                    this.elements.status.textContent = '游戏结束！踩到地雷了！';
                    this.elements.status.classList.add('lose');
                    return;
                }

                // 显示数字或空白
                if (cell.adjacentMines > 0) {
                    cell.element.textContent = cell.adjacentMines;
                    cell.element.classList.add(`num-${cell.adjacentMines}`);
                }

                // 如果是空白，递归翻开周围的格子
                if (cell.adjacentMines === 0) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;

                            const newRow = row + dr;
                            const newCol = col + dc;

                            if (
                                newRow >= 0 && newRow < this.rows &&
                                newCol >= 0 && newCol < this.cols &&
                                !this.board[newRow][newCol].isRevealed
                            ) {
                                // 添加延迟以创建波浪效果
                                setTimeout(() => {
                                    this.revealCell(newRow, newCol);
                                }, 50);
                            }
                        }
                    }
                }

                // 移除动画类
                setTimeout(() => {
                    cell.element.classList.remove('reveal-animation');
                }, 300);
            }

            toggleFlag(row, col) {
                if (this.gameOver || this.gameWon) return;

                const cell = this.board[row][col];
                if (cell.isRevealed) return;

                cell.isFlagged = !cell.isFlagged;

                if (cell.isFlagged) {
                    cell.element.classList.add('flagged', 'flag-animation');
                    cell.element.innerHTML = '🚩';
                    this.flags++;

                    // 移除动画类
                    setTimeout(() => {
                        cell.element.classList.remove('flag-animation');
                    }, 300);
                } else {
                    cell.element.classList.remove('flagged');
                    cell.element.innerHTML = '';
                    this.flags--;
                }

                // 更新显示
                this.updateDisplay();
                this.checkGameStatus();
            }

            revealAllMines() {
                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const cell = this.board[row][col];
                        if (cell.isMine && !cell.isFlagged) {
                            cell.element.classList.add('revealed', 'mine');
                            cell.element.innerHTML = '💣';
                        } else if (!cell.isMine && cell.isFlagged) {
                            cell.element.classList.add('revealed');
                            cell.element.innerHTML = '❌';
                            cell.element.style.color = '#ff6b6b';
                        }
                    }
                }
            }

            checkGameStatus() {
                // 检查是否胜利
                let allNonMinesRevealed = true;
                let allMinesFlagged = true;

                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const cell = this.board[row][col];

                        if (cell.isMine && !cell.isFlagged) {
                            allMinesFlagged = false;
                        }

                        if (!cell.isMine && !cell.isRevealed) {
                            allNonMinesRevealed = false;
                        }
                    }
                }

                // 胜利条件
                if (allNonMinesRevealed || allMinesFlagged) {
                    this.gameWon = true;
                    this.stopTimer();
                    this.elements.status.textContent = '恭喜！你赢了！🎉';
                    this.elements.status.classList.add('win');
                    this.createConfetti();
                }
            }

            startTimer() {
                this.time = 0;
                this.updateTimer();

                this.timer = setInterval(() => {
                    this.time++;
                    this.updateTimer();
                }, 1000);
            }

            stopTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            updateTimer() {
                this.elements.timer.textContent = this.time;
            }

            updateDisplay() {
                this.elements.mineCount.textContent = this.mines - this.flags;
                this.elements.flagCount.textContent = this.flags;
            }

            showHint() {
                if (this.gameOver || this.gameWon || this.firstClick) return;

                // 找到安全的可点击格子
                const safeCells = [];

                for (let row = 0; row < this.rows; row++) {
                    for (let col = 0; col < this.cols; col++) {
                        const cell = this.board[row][col];
                        if (!cell.isRevealed && !cell.isFlagged && !cell.isMine) {
                            safeCells.push(cell);
                        }
                    }
                }

                if (safeCells.length > 0) {
                    // 随机选择一个安全格子
                    const hintCell = safeCells[Math.floor(Math.random() * safeCells.length)];

                    // 添加提示效果
                    hintCell.element.style.backgroundColor = '#8a7df1';
                    hintCell.element.style.boxShadow = '0 0 15px rgba(138, 125, 241, 0.8)';

                    // 3秒后移除提示
                    setTimeout(() => {
                        hintCell.element.style.backgroundColor = '';
                        hintCell.element.style.boxShadow = '';
                    }, 3000);
                }
            }

            restartGame() {
                // 重置游戏状态
                this.gameOver = false;
                this.gameWon = false;
                this.firstClick = true;
                this.flags = 0;
                this.time = 0;

                // 停止计时器
                this.stopTimer();

                // 重置状态显示
                this.elements.status.textContent = '游戏开始！点击任意格子开始';
                this.elements.status.className = 'status';

                // 重新创建棋盘
                this.createBoard();
                this.updateDisplay();
                this.updateTimer();
            }

            toggleTheme() {
                document.body.classList.toggle('dark-mode');

                // 更新按钮图标
                const icon = this.elements.themeToggle.querySelector('i');
                if (document.body.classList.contains('dark-mode')) {
                    icon.className = 'fas fa-moon';
                    // 保存主题偏好
                    localStorage.setItem('minesweeper-theme', 'dark');
                } else {
                    icon.className = 'fas fa-sun';
                    // 保存主题偏好
                    localStorage.setItem('minesweeper-theme', 'light');
                }
            }

            checkSavedTheme() {
                // 检查保存的主题设置
                const savedTheme = localStorage.getItem('minesweeper-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                // 应用主题
                if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                    document.body.classList.add('dark-mode');
                    const icon = this.elements.themeToggle.querySelector('i');
                    icon.className = 'fas fa-moon';
                }
            }

            createConfetti() {
                const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#ff7675', '#a29bfe'];

                for (let i = 0; i < 100; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';

                    // 随机属性
                    const size = Math.random() * 10 + 5;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const left = Math.random() * 100;
                    const duration = Math.random() * 3 + 2;

                    confetti.style.width = `${size}px`;
                    confetti.style.height = `${size}px`;
                    confetti.style.backgroundColor = color;
                    confetti.style.left = `${left}%`;
                    confetti.style.animationDuration = `${duration}s`;

                    // 添加到页面
                    document.body.appendChild(confetti);

                    // 动画结束后移除
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000);
                }
            }

            setupInputEvents() {
                // 添加键盘快捷键支持
                document.addEventListener('keydown', (e) => {
                    // R键重新开始
                    if (e.key === 'r' || e.key === 'R') {
                        this.restartGame();
                    }

                    // H键提示
                    if (e.key === 'h' || e.key === 'H') {
                        this.showHint();
                    }

                    // T键切换主题
                    if (e.key === 't' || e.key === 'T') {
                        this.toggleTheme();
                    }
                });
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', () => {
            const game = new Minesweeper();

            // 添加开发者工具提示
            console.log('%c🎮 现代化扫雷游戏 %c\n✨ 白昼/黑夜双模式\n🎨 美观的界面和流畅动画\n📱 支持移动端和桌面端\n💡 快捷键：R=重新开始，H=提示，T=切换主题\n\n作者：AI助手',
                'color: #6c5ce7; font-size: 20px; font-weight: bold;',
                'color: #b2bec3; font-size: 14px;');
        });
    </script>
</body>
